
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Usure Obfuscator</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    background:
        radial-gradient(circle at 50% -20%, #343434 0%, #181818 42%, #0d0d0d 100%);
    color: #e7e7e7;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    min-height: 100vh;
}

.topbar {
    height: 64px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 28px;
    border-bottom: 1px solid #292929;
    background: rgba(14, 14, 14, 0.88);
    backdrop-filter: blur(12px);
}

.brand {
    display: flex;
    align-items: center;
    gap: 10px;
}

.brand-main {
    font-size: 18px;
    font-weight: 800;
    letter-spacing: 2px;
    color: #f2f2f2;
}

.brand-sub {
    font-size: 12px;
    color: #777;
    letter-spacing: 1.5px;
}

.back {
    color: #aaa;
    text-decoration: none;
    font-size: 13px;
    transition: color .15s ease;
}

.back:hover {
    color: #fff;
}

.container {
    width: min(1180px, calc(100% - 36px));
    margin: 30px auto 50px;
}

.header {
    margin-bottom: 22px;
}

.header h1 {
    margin: 0 0 7px;
    font-size: 25px;
    font-weight: 700;
}

.header p {
    margin: 0;
    color: #777;
    font-size: 13px;
}

.grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 18px;
}

.panel {
    border: 1px solid #292929;
    background: rgba(19, 19, 19, .94);
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 15px 45px rgba(0, 0, 0, .2);
}

.panel-head {
    height: 48px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 15px;
    border-bottom: 1px solid #292929;
    background: #171717;
}

.panel-title {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1px;
    color: #cfcfcf;
    text-transform: uppercase;
}

.status {
    font-size: 11px;
    color: #666;
}

textarea {
    display: block;
    width: 100%;
    height: 390px;
    resize: vertical;
    min-height: 250px;
    border: 0;
    outline: none;
    padding: 17px;
    background: #101010;
    color: #e5e5e5;
    font-family: Consolas, "Courier New", monospace;
    font-size: 13px;
    line-height: 1.6;
}

textarea::placeholder {
    color: #555;
}

.controls {
    display: flex;
    flex-wrap: wrap;
    gap: 9px;
    align-items: center;
    padding: 13px;
    border-top: 1px solid #292929;
    background: #151515;
}

select,
button {
    height: 36px;
    border-radius: 6px;
    border: 1px solid #303030;
    background: #202020;
    color: #ddd;
    padding: 0 13px;
    font-size: 12px;
    outline: none;
}

select {
    cursor: pointer;
}

button {
    cursor: pointer;
    transition:
        background .15s ease,
        border-color .15s ease,
        color .15s ease;
}

button:hover {
    background: #2a2a2a;
    border-color: #414141;
    color: #fff;
}

button.primary {
    background: #dedede;
    border-color: #dedede;
    color: #111;
    font-weight: 700;
}

button.primary:hover {
    background: #fff;
    border-color: #fff;
}

button:disabled {
    opacity: .45;
    cursor: not-allowed;
}

.spacer {
    flex: 1;
}

.info {
    margin-top: 18px;
    padding: 14px 16px;
    border: 1px solid #282828;
    border-radius: 8px;
    background: rgba(18, 18, 18, .8);
    color: #777;
    font-size: 12px;
    line-height: 1.6;
}

.info strong {
    color: #aaa;
}

.toast {
    position: fixed;
    left: 50%;
    bottom: 24px;
    transform: translateX(-50%) translateY(20px);
    padding: 10px 15px;
    border: 1px solid #333;
    border-radius: 7px;
    background: #181818;
    color: #ddd;
    font-size: 12px;
    opacity: 0;
    pointer-events: none;
    transition: all .2s ease;
    z-index: 100;
}

.toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
}

@media (max-width: 850px) {
    .grid {
        grid-template-columns: 1fr;
    }

    .topbar {
        padding: 0 17px;
    }

    .container {
        width: calc(100% - 24px);
        margin-top: 20px;
    }

    textarea {
        height: 320px;
    }
}
</style>
</head>

<body>

<header class="topbar">
    <div class="brand">
        <span class="brand-main">USURE</span>
        <span class="brand-sub">OBFUSCATOR</span>
    </div>

    <a class="back" href="https://nfdjiw2i.github.io/Usure/">
        ← Main
    </a>
</header>

<main class="container">

    <div class="header">
        <h1>Lua Obfuscator</h1>
        <p>Protect and package your Lua source into a runtime loader.</p>
    </div>

    <div class="grid">

        <!-- INPUT -->
        <section class="panel">

            <div class="panel-head">
                <span class="panel-title">Source</span>
                <span class="status" id="inputStatus">Ready</span>
            </div>

            <textarea
                id="input"
                spellcheck="false"
                placeholder="Paste your Lua code here...

Example:
print(333)"
            ></textarea>

            <div class="controls">

                <select id="mode">
                    <option value="normal">Obfuscate</option>
                    <option value="compact">Obfuscate + remove comments</option>
                </select>

                <button id="clearBtn">
                    Clear
                </button>

                <div class="spacer"></div>

                <button class="primary" id="processBtn">
                    Protect
                </button>

            </div>

        </section>

        <!-- OUTPUT -->
        <section class="panel">

            <div class="panel-head">
                <span class="panel-title">Output</span>
                <span class="status" id="outputStatus">Waiting</span>
            </div>

            <textarea
                id="output"
                spellcheck="false"
                readonly
                placeholder="Protected Lua will appear here..."
            ></textarea>

            <div class="controls">

                <button id="copyBtn">
                    Copy
                </button>

                <button id="saveBtn">
                    Save .lua
                </button>

            </div>

        </section>

    </div>

    <div class="info">
        <strong>Local protection:</strong>
        your Lua source is processed inside the browser.
        The Cloudflare Worker receives only processing metadata, not the source code.
    </div>

</main>

<div class="toast" id="toast"></div>

<script>
"use strict";

/*
    ============================================================
    CONFIG
    ============================================================
*/

const WORKER_URL =
    "https://usureobfuscatpr.lvlyvcbcla.workers.dev";

const MAX_SOURCE_SIZE =
    25 * 1024 * 1024;


/*
    ============================================================
    DOM
    ============================================================
*/

const input = document.getElementById("input");
const output = document.getElementById("output");

const mode = document.getElementById("mode");

const clearBtn = document.getElementById("clearBtn");
const processBtn = document.getElementById("processBtn");

const copyBtn = document.getElementById("copyBtn");
const saveBtn = document.getElementById("saveBtn");

const inputStatus = document.getElementById("inputStatus");
const outputStatus = document.getElementById("outputStatus");

const toast = document.getElementById("toast");


/*
    ============================================================
    UI
    ============================================================
*/

function showToast(message) {
    toast.textContent = message;
    toast.classList.add("show");

    clearTimeout(showToast.timer);

    showToast.timer = setTimeout(() => {
        toast.classList.remove("show");
    }, 2200);
}


/*
    ============================================================
    UTF-8
    ============================================================
*/

function utf8Encode(text) {
    return new TextEncoder().encode(text);
}


/*
    ============================================================
    COMMENT REMOVER
    ------------------------------------------------------------
    This intentionally preserves strings.
    It removes ordinary Lua comments without touching:
        "http://..."
        '--'
        long quoted strings in common cases.
    ============================================================
*/

function removeComments(source) {
    let result = "";
    let i = 0;

    let quote = null;

    while (i < source.length) {
        const c = source[i];
        const n = source[i + 1];

        // Inside normal string
        if (quote !== null) {
            result += c;

            if (c === "\\") {
                if (i + 1 < source.length) {
                    result += source[i + 1];
                    i += 2;
                    continue;
                }
            }

            if (c === quote) {
                quote = null;
            }

            i++;
            continue;
        }

        // Start string
        if (c === '"' || c === "'") {
            quote = c;
            result += c;
            i++;
            continue;
        }

        // Lua comment
        if (c === "-" && n === "-") {

            // Long comment --[[ ... ]]
            if (source[i + 2] === "[" && source[i + 3] === "[") {
                i += 4;

                while (i < source.length) {
                    if (
                        source[i] === "]" &&
                        source[i + 1] === "]"
                    ) {
                        i += 2;
                        break;
                    }

                    i++;
                }

                result += "\n";
                continue;
            }

            // Normal line comment
            i += 2;

            while (
                i < source.length &&
                source[i] !== "\n" &&
                source[i] !== "\r"
            ) {
                i++;
            }

            result += "\n";
            continue;
        }

        result += c;
        i++;
    }

    return result;
}


/*
    ============================================================
    WHITESPACE COMPACTION
    ============================================================
*/

function compactSource(source) {
    return source
        .replace(/[ \t]+/g, " ")
        .replace(/\n\s*\n+/g, "\n")
        .trim();
}


/*
    ============================================================
    RANDOM KEY
    ============================================================
*/

function randomBytes(length) {
    const data = new Uint8Array(length);
    crypto.getRandomValues(data);
    return data;
}


/*
    ============================================================
    XOR STREAM
    ------------------------------------------------------------
    This is obfuscation, not cryptographically secure encryption.
    The key is included in the generated loader because the
    resulting Lua file must be able to decode itself.
    ============================================================
*/

function xorTransform(data, key) {
    const output = new Uint8Array(data.length);

    let state = 0x13579bdf;

    for (let i = 0; i < data.length; i++) {

        state ^= state << 13;
        state ^= state >>> 17;
        state ^= state << 5;

        state >>>= 0;

        const k =
            key[i % key.length] ^
            ((state >>> ((i & 3) * 8)) & 0xff) ^
            ((i * 31) & 0xff);

        output[i] = data[i] ^ k;
    }

    return output;
}


/*
    ============================================================
    HEX
    ============================================================
*/

function bytesToHex(bytes) {
    let result = "";

    for (let i = 0; i < bytes.length; i++) {
        result += bytes[i]
            .toString(16)
            .padStart(2, "0");
    }

    return result;
}


/*
    ============================================================
    LUA BYTE TABLE
    ============================================================
*/

function bytesToLuaTable(bytes) {

    const parts = [];

    for (let i = 0; i < bytes.length; i++) {
        parts.push(String(bytes[i]));
    }

    return parts.join(",");
}


/*
    ============================================================
    LUA STRING BUILDER
    ============================================================
*/

function makeLuaString(bytes) {

    const table = bytesToLuaTable(bytes);

    return `{${table}}`;
}


/*
    ============================================================
    VARIABLE NAME GENERATOR
    ============================================================
*/

function randomName(length = 10) {

    const chars =
        "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ";

    let name = "_";

    const values = randomBytes(length);

    for (let i = 0; i < length; i++) {
        name += chars[values[i] % chars.length];
    }

    return name;
}


/*
    ============================================================
    GENERATE LUA LOADER
    ============================================================
*/

function generateLoader(source) {

    const plaintext = utf8Encode(source);

    const key = randomBytes(32);

    const encrypted = xorTransform(
        plaintext,
        key
    );

    const dataName = randomName();
    const keyName = randomName();
    const outName = randomName();
    const stateName = randomName();
    const iName = randomName();
    const loadName = randomName();
    const sourceName = randomName();

    const dataTable = makeLuaString(encrypted);
    const keyTable = makeLuaString(key);

    /*
        The state calculation is deliberately identical
        to the browser-side implementation.
    */

    const loader = `--[[ Usure Protected Lua ]]--

local ${dataName} = ${dataTable}

local ${keyName} = ${keyTable}

local ${outName} = {}

local ${stateName} = 0x13579bdf

for ${iName} = 1, #${dataName} do

    ${stateName} = bit32.bxor(
        ${stateName},
        bit32.lshift(${stateName}, 13)
    )

    ${stateName} = bit32.bxor(
        ${stateName},
        bit32.rshift(${stateName}, 17)
    )

    ${stateName} = bit32.bxor(
        ${stateName},
        bit32.lshift(${stateName}, 5)
    )

    ${stateName} = bit32.band(
        ${stateName},
        0xFFFFFFFF
    )

    local __shift =
        bit32.band(
            (${iName} - 1),
            3
        ) * 8

    local __stateByte =
        bit32.band(
            bit32.rshift(
                ${stateName},
                __shift
            ),
            255
        )

    local __keyByte =
        ${keyName}[
            ((${iName} - 1) %
            #${keyName}) + 1
        ]

    local __mix =
        bit32.band(
            (${iName} - 1) * 31,
            255
        )

    local __value =
        bit32.bxor(
            ${dataName}[${iName}],
            __keyByte,
            __stateByte,
            __mix
        )

    ${outName}[${iName}] =
        string.char(
            bit32.band(__value, 255)
        )
end

local ${sourceName} =
    table.concat(${outName})

local ${loadName} =
    loadstring or load

assert(
    ${loadName},
    "This Lua runtime does not provide loadstring/load"
)

local __fn, __err =
    ${loadName}(${sourceName})

assert(
    __fn,
    __err
)

return __fn()
`;

    return loader;
}


/*
    ============================================================
    FALLBACK LOADER
    ------------------------------------------------------------
    Some Lua runtimes do not expose bit32.
    This version provides a small compatibility layer.
    ============================================================
*/

function generateLoaderWithCompatibility(source) {

    const plaintext = utf8Encode(source);

    const key = randomBytes(32);

    const encrypted = xorTransform(
        plaintext,
        key
    );

    const dataName = randomName();
    const keyName = randomName();
    const outName = randomName();
    const stateName = randomName();
    const iName = randomName();
    const sourceName = randomName();
    const loadName = randomName();

    const dataTable = makeLuaString(encrypted);
    const keyTable = makeLuaString(key);

    /*
        Lua 5.1 / Roblox-style environments normally expose
        bit32. The compatibility fallback is included for
        runtimes where bit32 is unavailable.
    */

    return `--[[ Usure Protected Lua ]]--

local __bit = bit32

if not __bit then
    error("Usure loader requires bit32 support")
end

local ${dataName} = ${dataTable}

local ${keyName} = ${keyTable}

local ${outName} = {}

local ${stateName} = 0x13579bdf

for ${iName} = 1, #${dataName} do

    ${stateName} = __bit.bxor(
        ${stateName},
        __bit.lshift(${stateName}, 13)
    )

    ${stateName} = __bit.bxor(
        ${stateName},
        __bit.rshift(${stateName}, 17)
    )

    ${stateName} = __bit.bxor(
        ${stateName},
        __bit.lshift(${stateName}, 5)
    )

    ${stateName} = __bit.band(
        ${stateName},
        0xFFFFFFFF
    )

    local __shift =
        __bit.band(
            (${iName} - 1),
            3
        ) * 8

    local __stateByte =
        __bit.band(
            __bit.rshift(
                ${stateName},
                __shift
            ),
            255
        )

    local __keyByte =
        ${keyName}[
            ((${iName} - 1) %
            #${keyName}) + 1
        ]

    local __mix =
        __bit.band(
            (${iName} - 1) * 31,
            255
        )

    local __value =
        __bit.bxor(
            ${dataName}[${iName}],
            __keyByte,
            __stateByte,
            __mix
        )

    ${outName}[${iName}] =
        string.char(
            __bit.band(__value, 255)
        )
end

local ${sourceName} =
    table.concat(${outName})

local ${loadName} =
    loadstring or load

assert(
    ${loadName},
    "loadstring/load is unavailable"
)

local __fn, __err =
    ${loadName}(${sourceName})

assert(
    __fn,
    __err
)

return __fn()
`;
}


/*
    ============================================================
    SERVER NOTIFICATION
    ============================================================
*/

async function notifyWorker(size) {

    try {

        const response = await fetch(
            WORKER_URL + "/process",
            {
                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({
                    size: size,
                    timestamp: Date.now()
                })
            }
        );

        if (!response.ok) {
            return false;
        }

        const data =
            await response.json();

        return data.ok === true;

    } catch {
        return false;
    }
}


/*
    ============================================================
    PROTECT
    ============================================================
*/

async function protect() {

    let source = input.value;

    if (!source.trim()) {
        showToast("Enter Lua source first");
        return;
    }

    const size =
        new TextEncoder().encode(source).length;

    if (size > MAX_SOURCE_SIZE) {
        showToast("Source is too large");
        return;
    }

    processBtn.disabled = true;

    inputStatus.textContent = "Processing...";
    outputStatus.textContent = "Protecting...";

    try {

        /*
            Optional comment removal.
        */

        if (mode.value === "compact") {
            source = removeComments(source);
            source = compactSource(source);
        }

        /*
            Notify Worker with metadata only.
            Source itself never leaves browser.
        */

        await notifyWorker(size);

        /*
            Generate protected Lua.
        */

        const protectedCode =
            generateLoaderWithCompatibility(source);

        output.value = protectedCode;

        outputStatus.textContent = "Ready";
        inputStatus.textContent = "Protected";

        showToast("Protection completed");

    } catch (error) {

        console.error(error);

        outputStatus.textContent = "Error";

        showToast(
            "Protection failed"
        );

    } finally {
        processBtn.disabled = false;
    }
}


/*
    ============================================================
    CLEAR
    ============================================================
*/

clearBtn.addEventListener(
    "click",
    () => {

        input.value = "";
        output.value = "";

        inputStatus.textContent =
            "Ready";

        outputStatus.textContent =
            "Waiting";

        showToast("Cleared");
    }
);


/*
    ============================================================
    PROCESS
    ============================================================
*/

processBtn.addEventListener(
    "click",
    protect
);


/*
    ============================================================
    COPY
    ============================================================
*/

copyBtn.addEventListener(
    "click",
    async () => {

        if (!output.value) {
            showToast("Nothing to copy");
            return;
        }

        try {

            await navigator.clipboard.writeText(
                output.value
            );

            showToast("Copied");

        } catch {

            output.select();

            document.execCommand(
                "copy"
            );

            showToast("Copied");
        }
    }
);


/*
    ============================================================
    SAVE
    ============================================================
*/

saveBtn.addEventListener(
    "click",
    () => {

        if (!output.value) {
            showToast("Nothing to save");
            return;
        }

        const blob =
            new Blob(
                [output.value],
                {
                    type:
                        "text/plain;charset=utf-8"
                }
            );

        const url =
            URL.createObjectURL(blob);

        const link =
            document.createElement("a");

        link.href = url;
        link.download =
            "usure_protected.lua";

        document.body.appendChild(link);

        link.click();

        link.remove();

        URL.revokeObjectURL(url);

        showToast("Lua file saved");
    }
);


/*
    ============================================================
    INPUT STATUS
    ============================================================
*/

input.addEventListener(
    "input",
    () => {

        const bytes =
            new TextEncoder()
                .encode(input.value)
                .length;

        if (!bytes) {
            inputStatus.textContent =
                "Ready";
            return;
        }

        const kb =
            (bytes / 1024)
                .toFixed(1);

        inputStatus.textContent =
            kb + " KB";
    }
);
</script>

</body>
</html>
